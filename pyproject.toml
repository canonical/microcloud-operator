[project]
name = "microcloud"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "ops>=2.17",
    "pydantic>=1.10,<3",
    "cosl>=0.0.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "BLE",      # blind except
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
]
ignore = [
    "E501",    # line length handled by formatter
    "SIM117",  # nested with statements
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
