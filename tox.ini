[tox]
min_version = 4.0
env_list = lint, unit

[testenv]
set_env =
    PYTHONPATH = {tox_root}/src

[testenv:lint]
description = Check code style and type hints
deps =
    ruff==0.16.6
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:fmt]
description = Auto-fix formatting
deps =
    ruff==0.16.6
commands =
    ruff format src/ tests/
    ruff check --fix src/ tests/

[testenv:integration]
description = Run integration tests against a Juju controller
deps =
    pytest
    pyyaml
    jubilant>=1.12,<2
    pytest-jubilant>=2,<3
commands =
    pytest {tty:--color=yes} \
        --tb=native \
        -v \
        -s \
        --log-cli-level=INFO \
        tests/integration/ \
        {posargs}

[testenv:unit]
description = Run unit tests
deps =
    pytest
    pytest-cov
    ops[testing]
    pyyaml
commands =
    pytest {tty:--color=yes} \
        --tb=short \
        --cov=src \
        --cov-report=term-missing \
        tests/unit/ \
        {posargs}
