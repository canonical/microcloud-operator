[tox]
min_version = 4.0
env_list = lint, unit

[testenv]
set_env =
    PYTHONPATH = {tox_root}/src

[testenv:lint]
description = Check code style and type hints
deps =
    ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:fmt]
description = Auto-fix formatting
deps =
    ruff
commands =
    ruff format src/ tests/
    ruff check --fix src/ tests/

[testenv:integration]
description = Run integration tests against a Juju controller
deps =
    pytest
    pyyaml
    jubilant>=1.12,<2
    pytest-jubilant>=2,<3
pass_env =
    MICROCLOUD_CHARM_PATH
    LXD_CONTROLLER
    K8S_CONTROLLER
    MICROCLOUD_WORK_DIR
    RUNNER_TEMP
    GITHUB_WORKSPACE
    GITHUB_RUN_ID
    GITHUB_RUN_ATTEMPT
    VM_IMAGE
    VM_CPUS
    VM_MEMORY
    VM_ROOT_DISK
    CEPH_DISK_SIZE
    LXD_STORAGE_POOL
    LXD_BRIDGE
    LXD_CHANNEL
    MICROCLOUD_CHANNEL
    MICROCEPH_CHANNEL
    MICROOVN_CHANNEL
    UPLINK_NETWORK
    UPLINK_GATEWAY
    UPLINK_RANGE
    COS_CHANNEL
    OTEL_CHANNEL
    OTEL_BASE
    COS_OFFER_USER
commands =
    pytest {tty:--color=yes} \
        --tb=native \
        -v \
        -s \
        --log-cli-level=INFO \
        tests/integration/ \
        {posargs}

[testenv:unit]
description = Run unit tests
deps =
    pytest
    pytest-cov
    pyyaml
    pylxd
commands =
    pytest {tty:--color=yes} \
        --tb=short \
        --cov=src \
        --cov-report=term-missing \
        tests/unit/ \
        {posargs}
