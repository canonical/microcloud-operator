name: Build & Test

# Reusable workflow: static analysis, then pack the charm.
#
# amd64 only for now. arm64 needs either GitHub's arm runners or self-hosted
# ones; add an `arch` matrix here when that is available.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install tox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tox

      - name: Lint
        run: tox -e lint

      - name: Unit tests
        run: tox -e unit

  terraform:
    name: Terraform module (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The charm module, and the product module that calls it.
        module: ["terraform", "terraform/product"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The modules need 1.9 for their cross-variable validations.
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.53.0

      - name: Format
        # The charm module's leg recurses into product/ already.
        if: matrix.module == 'terraform'
        run: terraform fmt -check -recursive -diff

      - name: Init
        # No backend and no controller: this only fetches the provider schema.
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        run: |
          tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

      - name: Test
        # mock_provider, so no Juju controller is needed.
        run: terraform test

      - name: Documentation is current
        # Checksum pinned like every action in this workflow: the binary is
        # downloaded and executed, so it gets the same treatment.
        env:
          TFDOCS_SHA256: 34ae01772412bb11474e6718ea62113e38ff5964ee570a98c69fafe3a6dff286
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            https://terraform-docs.io/dl/v0.20.0/terraform-docs-v0.20.0-linux-amd64.tar.gz
          echo "${TFDOCS_SHA256}  /tmp/terraform-docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          /tmp/terraform-docs --config "${GITHUB_WORKSPACE}/.terraform-docs.yml" --output-check .

  build:
    name: Pack ubuntu@${{ matrix.base }}:${{ matrix.arch }}
    needs: [static]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One base failing should not hide the state of the others.
      fail-fast: false
      matrix:
        base: ["24.04", "26.04"]
        arch: ["amd64", "arm64"]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CRAFT_SHARED_CACHE: /tmp/charmcraft
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup LXD
        # charmcraft builds inside LXD.
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3
        timeout-minutes: 10
        with:
          channel: 6/stable

      - name: Install charmcraft
        run: sudo snap install --classic --channel=4.x/stable charmcraft
        timeout-minutes: 10

      - name: Cache charm build deps
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.CRAFT_SHARED_CACHE }}/**
          key: microcloud-deps-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            microcloud-deps-${{ matrix.arch }}-

      - name: Pack charm
        timeout-minutes: 45
        env:
          PLATFORM: ubuntu@${{ matrix.base }}:${{ matrix.arch }}
        run: |
          charmcraft pack --verbose --platform="${PLATFORM}"

          # Make the shared cache readable by the cache action.
          sudo chown -R "$USER" "${CRAFT_SHARED_CACHE}"

      - name: Analyse charm
        # charmcraft's own linters: packaging faults the unit tests cannot see.
        #
        # "entrypoint" and "pydeps" are charmcraft bugs, not charm bugs. The
        # dispatch script charmcraft's uv plugin generates ends in
        # "${dispatch_path}/src/charm.py", and charmcraft's linter reads that
        # line back without expanding the variable, so it looks for a literal
        # "${dispatch_path}" directory; that also degrades language, framework
        # and ops-main-call to "unknown". "pydeps" crashes outright and is
        # graded fatal while printing its own success text.
        run: |
          for charm in ./*.charm; do
            echo "::group::analyse $charm"
            charmcraft analyse --ignore entrypoint,pydeps "$charm"
            echo "::endgroup::"
          done

      - name: Upload charmcraft logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: logs-charmcraft-${{ matrix.base }}-${{ matrix.arch }}
          path: ~/.local/state/charmcraft/log/
          if-no-files-found: error
          retention-days: 7

      - name: Upload packed charms
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: microcloud-charm-${{ matrix.base }}-${{ matrix.arch }}
          path: "*.charm"
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration (ubuntu@${{ matrix.base }}, Juju ${{ matrix.juju-version }})
    # "build" already depends on "static".
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        base: ["24.04", "26.04"]
        juju-version: ["3.6"]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packed charm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: microcloud-charm-${{ matrix.base }}-amd64

      - name: Install tox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tox

      - name: Hold background updates
        # A snap refreshing or unattended-upgrades running mid-test reads as a
        # charm failure. Neither is wanted for the life of one CI job.
        run: |
          sudo snap refresh --hold
          sudo systemctl mask --now unattended-upgrades.service || true

      - name: Free disk space
        # Hosted runners start with only about 14 GB free, and LXD's dir pool
        # keeps a full copy of every unit's root filesystem, so the larger
        # models run out of disk and take the runner down with them. The
        # suite uses none of these preinstalled toolchains.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Provision Juju and LXD
        # concierge reads concierge.yaml from the working directory. The same
        # file is used for local runs, so CI and a developer machine provision
        # identically.
        timeout-minutes: 30
        env:
          CONCIERGE_JUJU_CHANNEL: "${{ matrix.juju-version }}/stable"
        run: |
          sudo snap install --classic concierge
          sudo --preserve-env=CONCIERGE_JUJU_CHANNEL \
            concierge prepare -c concierge.yaml --verbose

      - name: Run integration tests
        # Smoke and configuration recovery each deploy into their own model.
        timeout-minutes: 110
        run: |
          # The artifact holds exactly one charm: this job's platform.
          charm="$(ls ./*.charm)"
          mkdir -p logs
          tox -e integration -- --charm "${charm}" --juju-dump-logs logs/

      - name: Collect diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          # Best effort: the model may already be torn down, and a failure here
          # must not mask the test result.
          mkdir -p logs
          juju controllers >logs/juju-controllers.txt 2>&1 || true
          juju models >logs/juju-models.txt 2>&1 || true
          juju status --relations >logs/juju-status.txt 2>&1 || true
          juju debug-log --replay --no-tail >logs/juju-debug-log.txt 2>&1 || true
          df -h >logs/df.txt 2>&1 || true
          snap list >logs/snap-list.txt 2>&1 || true
          sudo lxc list --all-projects 2>&1 | tee logs/lxc-list.txt >/dev/null || true

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: logs-integration-${{ matrix.base }}-juju-${{ matrix.juju-version }}
          path: logs/
          if-no-files-found: error
          retention-days: 7
