name: Build & Test

# Reusable workflow: static analysis, pack the charm, then run integration
# tests against the packed artifact.
#
# amd64 only for now. arm64 needs either GitHub's arm runners or self-hosted
# ones; add an `arch` matrix here when that is available.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tox

      - name: Lint
        run: tox -e lint

      - name: Unit tests
        run: tox -e unit

  build:
    name: Pack ubuntu@${{ matrix.base }}:${{ matrix.arch }}
    needs: [static]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One base failing should not hide the state of the others.
      fail-fast: false
      matrix:
        base: ["24.04", "26.04"]
        arch: ["amd64", "arm64"]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CRAFT_SHARED_CACHE: /tmp/charmcraft
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup LXD
        # charmcraft builds inside LXD.
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        timeout-minutes: 10
        with:
          channel: 6/stable

      - name: Install charmcraft
        run: sudo snap install --classic --channel=4.x/stable charmcraft
        timeout-minutes: 10

      - name: Cache charm build deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CRAFT_SHARED_CACHE }}/**
          key: microcloud-deps-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            microcloud-deps-${{ matrix.arch }}-

      - name: Pack charm
        timeout-minutes: 45
        env:
          PLATFORM: ubuntu@${{ matrix.base }}:${{ matrix.arch }}
        run: |
          charmcraft pack --verbose --platform="${PLATFORM}"

          # Make the shared cache readable by the cache action.
          sudo chown -R "$USER" "${CRAFT_SHARED_CACHE}"

      - name: Analyse charm
        # charmcraft's own linters: packaging faults the unit tests cannot see.
        #
        # "entrypoint" and "pydeps" are charmcraft bugs, not charm bugs. The
        # dispatch script charmcraft's uv plugin generates ends in
        # "${dispatch_path}/src/charm.py", and charmcraft's linter reads that
        # line back without expanding the variable, so it looks for a literal
        # "${dispatch_path}" directory; that also degrades language, framework
        # and ops-main-call to "unknown". "pydeps" crashes outright and is
        # graded fatal while printing its own success text.
        run: |
          for charm in ./*.charm; do
            echo "::group::analyse $charm"
            charmcraft analyse --ignore entrypoint,pydeps "$charm"
            echo "::endgroup::"
          done

      - name: Upload charmcraft logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-charmcraft-${{ matrix.base }}-${{ matrix.arch }}
          path: ~/.local/state/charmcraft/log/
          if-no-files-found: error
          retention-days: 7

      - name: Upload packed charms
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microcloud-charm-${{ matrix.base }}-${{ matrix.arch }}
          path: "*.charm"
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration tests
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packed charm
        # Test the exact charm artifact produced by the build job.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: microcloud-charm-26.04-amd64
          path: ./artifacts

      - name: Get runner address
        # MicroK8s MetalLB needs an address from the runner's network.
        run: |
          echo "IPADDR=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')" >> "${GITHUB_ENV}"

      - name: Setup MicroK8s controller
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          juju-channel: 3.6/stable
          provider: microk8s
          channel: 1.36-strict/stable
          microk8s-addons: "hostpath-storage dns rbac metallb:${{ env.IPADDR }}-${{ env.IPADDR }}"
          bootstrap-constraints: "cores=2 mem=4G"

      - name: Save MicroK8s controller name
        id: k8s-controller
        run: echo "name=${CONTROLLER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Setup LXD controller
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          juju-channel: 3.6/stable
          provider: lxd
          bootstrap-constraints: "cores=1 mem=2G"

      - name: Save LXD controller name
        id: lxd-controller
        run: echo "name=${CONTROLLER_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run integration tests
        env:
          MICROCLOUD_CHARM_PATH: ${{ github.workspace }}/artifacts/microcloud_ubuntu@26.04-amd64.charm
          LXD_CONTROLLER: ${{ steps.lxd-controller.outputs.name }}
          K8S_CONTROLLER: ${{ steps.k8s-controller.outputs.name }}
          MICROCLOUD_LOG_DIR: ${{ runner.temp }}/microcloud-integration-logs
        run: bash tests/integration/run.sh

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: logs-integration
          path: ${{ runner.temp }}/microcloud-integration-logs
          if-no-files-found: warn
          retention-days: 7
